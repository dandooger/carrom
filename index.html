<title>קארום</title>

<style>
/* Layout: landscape game table — score cards in the left column, the square board in the middle, coach + placing rail in the right column;
   the lobby is a full-screen landscape menu (top bar, stake tables carousel, game modes row); other menus rise as a sheet */
:root{
  --night:#14213a; --indigo:#1e3158; --indigo-2:#2a416f; --ivory:#f5ecd9; --ivory-dim:#b9b2a3;
  --saffron:#f2a531; --vermilion:#d4462f; --line:rgba(245,236,217,.16);
  --font-display:"Suez One","Assistant",Georgia,serif;
  --font-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background-color:var(--night);color:var(--ivory);font-family:var(--font-body);font-size:15px;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(rgba(242,165,49,.07) 1.4px,transparent 1.8px),radial-gradient(ellipse at 50% 40%,rgba(42,65,111,.55),transparent 70%);
  background-size:22px 22px,100% 100%}
#app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) var(--bs,320px) minmax(0,1fr);gap:14px;direction:ltr;
  padding-block:5px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.side{direction:rtl;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.side-a .iconbtn{margin-top:auto;width:52px;height:52px;align-self:flex-start}
.side-b #placer{margin-top:auto}
@media (orientation:portrait){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:8px;max-width:760px;margin:0 auto}
  .side-a{flex-direction:row;align-items:stretch}
  .side-a .team{flex:1}
  .side-a .iconbtn{margin-top:0;height:auto}
}
.team{flex:none;min-width:0;display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:14px;background:var(--indigo);
  border:1.5px solid transparent;transition:border-color .25s,background .25s}
.team.on{border-color:var(--saffron);background:var(--indigo-2)}
.chip{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.45)}
.chip.w{background:radial-gradient(circle at 35% 35%,#fffaf0,#dccaa6)}
.chip.b{background:radial-gradient(circle at 35% 35%,#5a4b44,#17110f)}
.chip.n{background:radial-gradient(circle at 35% 35%,#9a968e,#57534d)}
.tinfo{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.2}
.tname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:12px;color:var(--ivory-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
.tcount{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums;flex:none;display:flex;align-items:baseline;gap:3px}
.tcount small{font-family:var(--font-body);font-size:12px;color:var(--ivory-dim)}
.qdot{width:11px;height:11px;border-radius:50%;background:var(--vermilion);flex:none;box-shadow:0 0 0 2px rgba(212,70,47,.3)}
.qdot.pending{opacity:.45}
.iconbtn{flex:none;width:44px;border-radius:14px;background:var(--indigo);border:0;color:var(--ivory);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
#stage{position:relative;display:grid;place-items:center;min-width:0;min-height:0}
#board{display:block;touch-action:none;border-radius:20px;box-shadow:0 20px 44px rgba(0,0,0,.5)}
#toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-6px);max-width:calc(100% - 40px);box-sizing:border-box;z-index:2;
  background:rgba(20,33,58,.94);border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#placer{flex:none;width:100%;height:60px;position:relative;direction:ltr;touch-action:none;cursor:pointer;transition:opacity .2s}
#placer.off{opacity:.35;cursor:default}
#placer .rail{position:absolute;left:0;right:0;top:50%;height:30px;transform:translateY(-50%);border-radius:15px;
  background:linear-gradient(#5e3119,#3d1d0d);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 1px 0 rgba(255,220,180,.12)}
#placer .rail::before{content:"";position:absolute;left:26px;right:26px;top:50%;height:2px;transform:translateY(-50%);background:rgba(242,165,49,.55);border-radius:1px}
#placer .end{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#b3302a;box-shadow:0 0 0 2px #2b1b10}
#placer .thumb{position:absolute;top:50%;left:0;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;will-change:transform;
  background:radial-gradient(circle at 36% 32%,#ffffff,#f3ecdc 55%,#d3c39f);box-shadow:0 3px 6px rgba(0,0,0,.45),0 0 0 2px rgba(143,125,90,.6)}
#placer.bad .thumb{box-shadow:0 3px 6px rgba(0,0,0,.45),0 0 0 3px var(--vermilion)}
#placer.drag .thumb{box-shadow:0 3px 8px rgba(0,0,0,.5),0 0 0 3px var(--saffron)}
#placer:focus-visible{outline:2px solid var(--saffron);outline-offset:3px;border-radius:16px}
#coach{flex:none;display:flex;flex-direction:column;justify-content:center;text-align:center;line-height:1.3;gap:4px;
  background:var(--indigo);border-radius:14px;padding:10px 12px;min-height:3.2em}
#coachMain{font-weight:800;font-size:16px;color:var(--saffron)}
#clock{display:flex;align-items:center;gap:12px;background:var(--indigo);border-radius:14px;padding:8px 14px}
#clock svg{width:46px;height:50px;flex:none;overflow:visible}
#clock .face{fill:var(--night);stroke:var(--ivory);stroke-width:2.5}
#clock .crown{fill:var(--ivory)}
#clock .track{fill:none;stroke:rgba(245,236,217,.12);stroke-width:4.5}
#clock .arc{fill:none;stroke:var(--saffron);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:100.53;transform:rotate(-90deg);transform-origin:24px 29px}
#clock .hand{stroke:var(--ivory);stroke-width:2.2;stroke-linecap:round;transform-origin:24px 29px}
#clock .pin{fill:var(--ivory)}
#clock .clk{display:flex;flex-direction:column;line-height:1.1;min-width:0}
#clock b{font-family:var(--font-display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
#clock small{font-size:12px;color:var(--ivory-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock.low .arc{stroke:var(--vermilion)}
#clock.low b{color:#ff9b87}
#clock.low svg{animation:tick 1s ease-in-out infinite}
@keyframes tick{50%{transform:scale(1.07)}}
#coachSub{font-size:14px;color:var(--ivory-dim)}
#coachMain:empty+#coachSub:empty{display:none}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  background:rgba(9,15,29,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet.full{padding:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.panel{width:100%;max-width:520px;max-height:100%;overflow-y:auto;touch-action:pan-y;box-sizing:border-box;background:var(--indigo);
  border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.panel h1{font-family:var(--font-display);font-weight:400;font-size:46px;line-height:1;margin:0;color:var(--saffron);text-wrap:balance}
.panel h2{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.lead{margin:0 0 4px;color:var(--ivory-dim);line-height:1.45}
.btn{font:inherit;font-weight:700;font-size:17px;padding:13px 16px;border-radius:14px;border:0;background:var(--indigo-2);color:var(--ivory);
  cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:2px;width:100%}
.btn small{font-weight:400;font-size:13px;color:var(--ivory-dim)}
.btn.primary{background:var(--saffron);color:#2b1a04;align-items:center;text-align:center}
.btn.quiet{background:transparent;color:var(--ivory-dim);align-items:center;text-align:center;font-weight:600;font-size:15px;padding:10px}
.btn.small{font-size:14px;padding:9px 8px;align-items:center;text-align:center}
.btn.buy{background:var(--saffron);color:#2b1a04}
.btn.confirm{background:var(--vermilion);color:var(--ivory)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,.arena:focus-visible,.mode:focus-visible,.tb:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.label{font-size:12px;letter-spacing:.06em;color:var(--ivory-dim);font-weight:700;margin:4px 0 -4px}
.seg{display:flex;background:var(--night);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;font:inherit;font-weight:700;font-size:15px;padding:10px 4px;border:0;border-radius:9px;background:transparent;color:var(--ivory-dim);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ivory);color:var(--night)}
.wallet{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--night);padding:6px 14px 6px 10px;border-radius:999px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#ffe9a8,#e2a92c 60%,#a5711a);box-shadow:inset 0 0 0 2px rgba(120,80,10,.45)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.skin{background:var(--night);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;border:1.5px solid transparent}
.skin.using{border-color:var(--saffron)}
.skinprev{width:100%;max-width:100%;aspect-ratio:1;border-radius:10px;display:block}
.skname{font-weight:800;font-size:15px}
.skdesc{font-size:12px;color:var(--ivory-dim);line-height:1.35;flex:1}
.tag{font-size:14px;font-weight:800;color:var(--saffron);text-align:center;padding:9px 0}
.result{display:flex;justify-content:center;gap:18px;font-family:var(--font-display);font-size:30px;font-variant-numeric:tabular-nums}
.result span{display:flex;flex-direction:column;align-items:center;gap:2px}
.result small{font-family:var(--font-body);font-size:13px;color:var(--ivory-dim)}
.bet{font-weight:800;text-align:center;margin:0}
.bet.win{color:var(--saffron)} .bet.lose{color:var(--ivory-dim)}
.acctrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.acctrow h2{flex:1;min-width:0;overflow-wrap:anywhere}
.acctbtn{font:inherit;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:8px;background:var(--indigo-2);color:var(--ivory);border:0;border-radius:999px;padding:5px 14px 5px 6px;cursor:pointer;max-width:100%}
.acctbtn:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--saffron);color:#2b1a04;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.avatar.big{width:52px;height:52px;font-size:26px;font-family:var(--font-display)}
.err{margin:0;color:#ff9b87;font-weight:700;font-size:14px;line-height:1.4}
.wform{display:flex;flex-direction:column;gap:10px}
input[type=password],input[type=text]{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--night);color:var(--ivory);width:100%;box-sizing:border-box}
.codein{direction:ltr;text-align:center;letter-spacing:.3em;text-transform:uppercase;font-family:var(--font-display)!important;font-size:24px!important}
.code{font-family:var(--font-display);font-size:52px;letter-spacing:.2em;direction:ltr;text-align:center;color:var(--saffron);line-height:1.1}
.seats{display:grid;gap:8px}
.seat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--night);font-weight:600}
.seat .empty{color:var(--ivory-dim);font-weight:400}
.note{font-size:13px;color:var(--ivory-dim);margin:0;line-height:1.45}
.divider{display:flex;align-items:center;gap:10px;color:var(--ivory-dim);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.rules{margin:0;padding-inline-start:20px;display:grid;gap:7px;line-height:1.45}
.rules b{color:var(--saffron)}
.big{font-family:var(--font-display);font-size:56px;line-height:1;text-align:center;color:var(--saffron)}
/* lobby */
.panel.lobby{max-width:none;width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none;overflow:hidden;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(rgba(255,214,140,.08) 1.4px,transparent 1.8px) 0 0/22px 22px,
    linear-gradient(180deg,#16244a 0%,#3a2a68 52%,#a1453c 88%,#d9783a 100%)}
.topbar{display:flex;align-items:center;gap:8px;min-width:0;overflow-x:auto;touch-action:pan-x;scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}
.topbar .wallet{align-self:center;background:rgba(10,16,32,.55)}
.tb{font:inherit;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none;
  background:rgba(10,16,32,.55);color:var(--ivory);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 14px;cursor:pointer}
.tb.hot{background:var(--saffron);color:#2b1a04;border-color:transparent}
.spacer{flex:1}
.arenas{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x;padding:2px 4px 6px;align-items:stretch;scrollbar-width:none;direction:rtl}
.arenas::-webkit-scrollbar{display:none}
.arena{flex:0 0 clamp(220px,34vw,320px);scroll-snap-align:center;font:inherit;color:#fff;text-align:start;cursor:pointer;border:0;border-radius:20px;
  padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;min-height:0;
  background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.22),transparent 45%),linear-gradient(160deg,var(--a1),var(--a2));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 10px 24px rgba(0,0,0,.35)}
.arena:disabled{cursor:default;filter:saturate(.45) brightness(.8)}
.aname{font-family:var(--font-display);font-size:clamp(24px,4.2vh + 6px,36px);line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.asub{font-size:13px;opacity:.85;margin-top:-2px}
.aprize{margin-top:auto;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border-radius:12px;padding:8px 12px;font-weight:800;font-size:clamp(17px,3vh + 4px,24px)}
.aprize .coin{width:22px;height:22px}
.ameta{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;flex-wrap:wrap}
.ameta span{white-space:nowrap}
.abox{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;opacity:.95}
.lvl{display:inline-flex;gap:2px;vertical-align:middle}
.lvl i{width:6px;height:10px;border-radius:2px;background:rgba(255,255,255,.3)}
.lvl i.on{background:#ffd75e}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.mode{font:inherit;color:#fff;border:0;border-radius:16px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;
  min-height:58px;text-align:start;background:linear-gradient(160deg,var(--m1),var(--m2));box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.3)}
.mode b{font-size:16px;font-weight:800;line-height:1.15}
.mode small{font-size:12px;opacity:.85;line-height:1.2}
.mode:disabled{filter:grayscale(.7) brightness(.8);cursor:default}
/* boxes */
.minibox{width:22px;height:18px;border-radius:4px 4px 5px 5px;flex:none;position:relative;background:linear-gradient(var(--c1),var(--c2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.minibox::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:rgba(0,0,0,.3)}
.minibox::after{content:"";position:absolute;left:50%;top:4px;width:5px;height:6px;margin-left:-2.5px;border-radius:1px;background:#ffe39a}
.chestwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.chestwrap .chest{margin-top:30px}
.panel.split{max-width:780px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
.split .col{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (orientation:portrait){.panel.split{grid-template-columns:minmax(0,1fr)}}
@media (max-height:460px){
  .chestwrap{gap:2px}
  .chestwrap .chest{margin-top:22px;width:110px;height:92px}
  .chest .body{height:52px}
  .chest .lid{height:38px;top:8px}
  .chest .lock{top:36px;width:20px;height:22px;margin-left:-10px}
  .boxname{font-size:20px}
  .reward{padding:6px 10px;min-width:84px;gap:3px}
  .reward canvas{width:56px;height:56px}
  .reward .coin{width:22px;height:22px}
  .panel .big{font-size:42px}
}
.chest{position:relative;width:132px;height:112px;cursor:pointer;border:0;background:none;padding:0;font:inherit}
.chest .glow{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,232,160,.85),rgba(255,200,90,.2) 45%,transparent 68%);opacity:0;transform:scale(.4);transition:opacity .5s,transform .6s;pointer-events:none}
.chest .body{position:absolute;bottom:0;left:6px;right:6px;height:64px;border-radius:8px 8px 14px 14px;background:linear-gradient(var(--c1),var(--c2));
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.25),inset 0 0 0 3px rgba(0,0,0,.18),0 10px 18px rgba(0,0,0,.45)}
.chest .body::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:18px;margin-left:-9px;background:linear-gradient(#fff1bd,#c9962c)}
.chest .lid{position:absolute;top:10px;left:0;right:0;height:46px;border-radius:46px 46px 8px 8px;background:linear-gradient(var(--c1),var(--c2));
  box-shadow:inset 0 5px 0 rgba(255,255,255,.25),inset 0 0 0 3px rgba(0,0,0,.18);transform-origin:20% 100%;transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
.chest .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:18px;margin-left:-9px;background:linear-gradient(#fff1bd,#c9962c)}
.chest .lock{position:absolute;left:50%;top:44px;width:24px;height:26px;margin-left:-12px;border-radius:5px;background:linear-gradient(#fff3c4,#d9a52c);box-shadow:0 2px 0 rgba(0,0,0,.3);transition:opacity .3s}

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ---------------- board geometry (1 unit ≈ 0.74 mm of a real 74 cm board) ---------------- */
// pieces are drawn a little bigger than a real board, and the frame thinner, so they read well on a phone
const HALF = 500, FRAME = 40;
const R_C = 26, R_S = 33, M_C = 1, M_S = 2.8;
const POCKET = 470, POCKET_R = 36, POCKET_DRAW = 38;
const BASE_Y = 341.5, BASE_X = 296;
// the striker sits either fully on an end circle or on the line without touching it — never half on the circle
const BASE_CIRCLE_R = 21.5, LINE_MAX = BASE_X + .5 - BASE_CIRCLE_R - R_S;
function legalX(x) {
  const a = Math.abs(x), s = x < 0 ? -1 : 1;
  if (a <= LINE_MAX) return x;
  return s * (a < (LINE_MAX + BASE_X) / 2 ? LINE_MAX : BASE_X);
}
const DT = 1 / 400, FR = 850, E_BALL = 0.9, E_WALL = 0.62, STOP = 4, VMAX = 5200, POWER = 0.85;
const POCKETS = [[POCKET, POCKET], [-POCKET, POCKET], [-POCKET, -POCKET], [POCKET, -POCKET]];
const colorOf = i => i === 0 ? 'q' : i <= 9 ? 'w' : i <= 18 ? 'b' : 's';
const colorOfTeam = T => T === 0 ? 'w' : 'b';
const round2 = v => Math.round(v * 100) / 100;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const HOWTO = 'מקם במסילה שמימין · על הלוח: החלק את הסטרייקר בתנופה';

// seat-local -> world: seat 0 bottom, 1 right, 2 top, 3 left (turns go counter-clockwise)
function rotW(x, y, s) { s = ((s % 4) + 4) % 4; for (let i = 0; i < s; i++) { const t = x; x = y; y = -t; } return [x, y]; }

/* ---------------- state ---------------- */
function initialCoins() {
  const c = new Array(19).fill(null);
  c[0] = [0, 0];
  const d = 2 * R_C + 0.6;
  let w = 1, b = 10;
  const put = (col, x, y) => { const i = col === 'w' ? w++ : b++; c[i] = [round2(x), round2(y)]; };
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3 + Math.PI / 6;
    put(k % 2 ? 'b' : 'w', d * Math.cos(a), d * Math.sin(a));
    put(k % 2 ? 'b' : 'w', 2 * d * Math.cos(a), 2 * d * Math.sin(a));
    const a2 = a + Math.PI / 6, r2 = d * Math.sqrt(3);
    put(k % 2 ? 'w' : 'b', r2 * Math.cos(a2), r2 * Math.sin(a2));
  }
  return c;
}
function newState(fmt) {
  return { fmt, seats: fmt === '2v2' ? [0, 1, 2, 3] : [0, 2], coins: initialCoins(), queen: null,
    colors: null, debt: [0, 0], turn: 0, shotNo: 0, winner: null, final: null, msg: '', gid: Math.floor(Math.random() * 1e9) };
}
// house rules: a team's colour is whatever it pockets first; queen = +3 once covered
const otherColor = c => c === 'w' ? 'b' : 'w';
const colorName = c => coinSetById(W$.data.equip.coins).labels[c === 'w' ? 0 : 1];
const teamColor = (st, T) => st.colors ? st.colors[T] : null;
function teamPoints(st, T) {
  const c = teamColor(st, T);
  return (c ? pocketedOf(st.coins, c).length : 0) + (st.queen && st.queen.covered && st.queen.by === T ? 3 : 0) - ((st.debt && st.debt[T]) || 0);
}
const teamOf = (st, s) => st.fmt === '2v2' ? s % 2 : (s === 0 ? 0 : 1);
const curSeat = st => st.seats[st.turn];
function pocketedOf(coins, col) { const a = []; for (let i = 1; i < 19; i++) if (colorOf(i) === col && !coins[i]) a.push(i); return a; }
function onBoardOf(coins, col) { const a = []; for (let i = 0; i < 19; i++) if (colorOf(i) === col && coins[i]) a.push(i); return a; }
function overlapsAny(coins, x, y, r, skip) {
  for (let i = 0; i < 19; i++) {
    if (i === skip || !coins[i]) continue;
    const dx = coins[i][0] - x, dy = coins[i][1] - y, rr = r + R_C;
    if (dx * dx + dy * dy < rr * rr) return true;
  }
  return false;
}
function freeSpot(coins) {
  if (!overlapsAny(coins, 0, 0, R_C + 0.3)) return [0, 0];
  for (let r = 2 * R_C + 1; r < 260; r += R_C) {
    const n = Math.max(6, Math.floor(2 * Math.PI * r / (2 * R_C + 1)));
    for (let k = 0; k < n; k++) {
      const a = k * 2 * Math.PI / n, x = round2(r * Math.cos(a)), y = round2(r * Math.sin(a));
      if (!overlapsAny(coins, x, y, R_C + 0.3)) return [x, y];
    }
  }
  return [0, 0];
}
function validPlace(lx, seat, coins) { const [x, y] = rotW(lx, BASE_Y, seat); return !overlapsAny(coins, x, y, R_S); }
function startX(seat, coins) {
  for (let d = 0; d <= LINE_MAX; d += 3) {
    if (validPlace(d, seat, coins)) return d;
    if (validPlace(-d, seat, coins)) return -d;
  }
  for (const x of [BASE_X, -BASE_X]) if (validPlace(x, seat, coins)) return x;
  return 0;
}

/* ---------------- physics ---------------- */
function makeBodies(coins) {
  const B = [];
  for (let i = 0; i < 19; i++) if (coins[i]) B.push({ i, x: coins[i][0], y: coins[i][1], vx: 0, vy: 0, r: R_C, m: M_C, out: false });
  return B;
}
function step(B, ev) {
  const n = B.length, dec = FR * DT;
  for (let k = 0; k < n; k++) {
    const b = B[k];
    if (b.out || (b.vx === 0 && b.vy === 0)) continue;
    const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy), ns = sp - dec;
    if (ns <= STOP) { b.vx = 0; b.vy = 0; continue; }
    const f = ns / sp; b.vx *= f; b.vy *= f;
    b.x += b.vx * DT; b.y += b.vy * DT;
  }
  for (let a = 0; a < n; a++) {
    const A = B[a]; if (A.out) continue;
    for (let c = a + 1; c < n; c++) {
      const C = B[c]; if (C.out) continue;
      if (A.vx === 0 && A.vy === 0 && C.vx === 0 && C.vy === 0) continue;
      const dx = A.x - C.x, dy = A.y - C.y, rr = A.r + C.r, d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 < 1e-9) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = rr - d, im = 1 / A.m + 1 / C.m;
      const fa = (1 / A.m) / im, fc = (1 / C.m) / im;
      A.x += nx * ov * fa; A.y += ny * ov * fa; C.x -= nx * ov * fc; C.y -= ny * ov * fc;
      const rel = (A.vx - C.vx) * nx + (A.vy - C.vy) * ny;
      if (rel < 0) {
        if (ev.track) {
          if (A.own !== undefined) C.lt = A.own; else if (C.own !== undefined) A.lt = C.own;
          else if (A.vx * A.vx + A.vy * A.vy > C.vx * C.vx + C.vy * C.vy) { if (A.lt !== undefined) C.lt = A.lt; } else if (C.lt !== undefined) A.lt = C.lt;
        }
        const j = -(1 + E_BALL) * rel / im;
        A.vx += j * nx / A.m; A.vy += j * ny / A.m; C.vx -= j * nx / C.m; C.vy -= j * ny / C.m;
        if (ev.hits) ev.hits.push(-rel);
      }
    }
  }
  const PL = POCKET - POCKET_R;
  for (let k = 0; k < n; k++) {
    const b = B[k]; if (b.out) continue;
    const lim = HALF - b.r;
    if (b.x > lim) { b.x = lim; if (b.vx > 0) { if (ev.hits) ev.hits.push(b.vx * .5); b.vx = -b.vx * E_WALL; } }
    else if (b.x < -lim) { b.x = -lim; if (b.vx < 0) { if (ev.hits) ev.hits.push(-b.vx * .5); b.vx = -b.vx * E_WALL; } }
    if (b.y > lim) { b.y = lim; if (b.vy > 0) { if (ev.hits) ev.hits.push(b.vy * .5); b.vy = -b.vy * E_WALL; } }
    else if (b.y < -lim) { b.y = -lim; if (b.vy < 0) { if (ev.hits) ev.hits.push(-b.vy * .5); b.vy = -b.vy * E_WALL; } }
    if ((b.x > PL || b.x < -PL) && (b.y > PL || b.y < -PL)) {
      for (let p = 0; p < 4; p++) {
        const dx = b.x - POCKETS[p][0], dy = b.y - POCKETS[p][1];
        if (dx * dx + dy * dy < POCKET_R * POCKET_R) { b.out = true; ev.pocketed.push({ i: b.i, p, x: b.x, y: b.y }); b.vx = 0; b.vy = 0; break; }
      }
    }
  }
}
function anyMoving(B) { for (const b of B) if (!b.out && (b.vx !== 0 || b.vy !== 0)) return true; return false; }
function simulate(coins, shot, maxT) {
  const B = makeBodies(coins);
  B.push({ i: 19, x: shot.x, y: shot.y, vx: shot.vx, vy: shot.vy, r: R_S, m: M_S, out: false });
  const ev = { pocketed: [], hits: null };
  const max = (maxT || 12) / DT;
  for (let s = 0; s < max; s++) { step(B, ev); if (!anyMoving(B)) break; }
  return { B, ev };
}

/* ---------------- rules ---------------- */
function applyRules(st0, B, ev) {
  const st = JSON.parse(JSON.stringify(st0));
  st.debt = Array.isArray(st.debt) ? st.debt : [0, 0];
  const seat = curSeat(st), T = teamOf(st, seat);
  const coins = new Array(19).fill(null);
  for (const b of B) if (b.i < 19 && !b.out) coins[b.i] = [round2(b.x), round2(b.y)];
  st.coins = coins;
  const potCoins = []; let potQ = false, foul = false;
  for (const p of ev.pocketed) {
    const c = colorOf(p.i);
    if (c === 's') foul = true; else if (c === 'q') potQ = true; else potCoins.push(p.i);
  }
  const msgs = []; let cont = false;
  const toCenter = i => { if (!st.coins[i]) st.coins[i] = freeSpot(st.coins); };
  // the queen is worth more: she always gets the exact center, and a coin sitting there moves beside her
  const queenHome = () => {
    if (st.coins[0]) return;
    st.coins[0] = [0, 0];
    for (let i = 1; i < 19; i++) {
      const c = st.coins[i];
      if (c && c[0] * c[0] + c[1] * c[1] < (2 * R_C + .3) * (2 * R_C + .3)) { st.coins[i] = null; st.coins[i] = freeSpot(st.coins); }
    }
  };
  // first clean pocket of the game decides the colours, by the first coin that dropped
  if (!st.colors && !foul && potCoins.length) {
    const c = colorOf(potCoins[0]);
    st.colors = T === 0 ? [c, otherColor(c)] : [otherColor(c), c];
    msgs.push('הצבעים נקבעו!');
  }
  const own = teamColor(st, T);
  const potOwn = own ? potCoins.filter(i => colorOf(i) === own) : [];
  if (foul) {
    msgs.push('פאול! הסטרייקר נפל לכיס');
    if (potOwn.length) {
      // your own coin went in with the striker: only that coin comes back (no extra penalty),
      // and it still covers the queen, so the 3 points stay
      potOwn.forEach(toCenter);
      if (potQ) { st.queen = { by: T, covered: true }; msgs.push('המלכה כוסתה! +3 נקודות'); }
      else if (st.queen && !st.queen.covered && st.queen.by === T) { st.queen.covered = true; msgs.push('כיסית את המלכה! +3 נקודות'); }
      msgs.push(potOwn.length > 1 ? 'מה שהכנסת חוזר למרכז' : 'האסימון שהכנסת חוזר למרכז');
    } else {
      // nothing of yours to give back yet: you owe one, paid with the next coin you pocket
      const owe = () => { st.debt[T]++; msgs.push('עוד אין לך אסימון להחזיר — מינוס נקודה'); };
      if (!own) { potCoins.forEach(toCenter); owe(); }
      else {
        const prev = pocketedOf(st.coins, own);
        if (prev.length) { toCenter(prev[prev.length - 1]); msgs.push('אסימון אחד שלך חוזר למרכז'); }
        else owe();
      }
      if (potQ) queenHome();
      if (st.queen && !st.queen.covered && st.queen.by === T) { queenHome(); st.queen = null; }
    }
  } else {
    if (potQ) {
      if (potOwn.length) { st.queen = { by: T, covered: true }; msgs.push('המלכה נכנסה וכוסתה! +3 נקודות'); }
      else { st.queen = { by: T, covered: false }; msgs.push('המלכה בכיס! הכנס עכשיו אסימון שלך כדי לקבל 3 נקודות'); cont = true; }
    } else if (st.queen && !st.queen.covered && st.queen.by === T) {
      if (potOwn.length) { st.queen.covered = true; msgs.push('כיסית את המלכה! +3 נקודות'); }
      else { queenHome(); st.queen = null; msgs.push('לא כיסית — המלכה חוזרת למרכז'); }
    }
    if (potOwn.length) { cont = true; if (msgs.length < 1 || (msgs.length === 1 && msgs[0].startsWith('הצבעים'))) msgs.push(potOwn.length > 1 ? `נכנסו ${potOwn.length} — עוד תור!` : 'נכנס! עוד תור'); }
    else if (potCoins.length && !potQ) msgs.push('הכנסת אסימון של היריב');
    if (potOwn.length && st.debt[T] > 0) {
      const pay = Math.min(st.debt[T], potOwn.length);
      for (let k = 0; k < pay; k++) toCenter(potOwn[potOwn.length - 1 - k]);
      st.debt[T] -= pay;
      msgs.push(pay > 1 ? 'החוב שולם — האסימונים חזרו למרכז' : 'החוב שולם — האסימון חזר למרכז');
    }
  }
  // the board ends when one colour is fully pocketed; most points wins
  if (st.colors) {
    const done = [0, 1].filter(t => pocketedOf(st.coins, st.colors[t]).length === 9);
    if (done.length) {
      if (st.queen && !st.queen.covered) { queenHome(); st.queen = null; }
      const p0 = teamPoints(st, 0), p1 = teamPoints(st, 1);
      st.winner = p0 > p1 ? 0 : p1 > p0 ? 1 : done[0];
      st.final = [p0, p1];
    }
  }
  if (st.winner === null && !cont) st.turn = (st.turn + 1) % st.seats.length;
  st.shotNo++;
  st.msg = msgs.join(' · ');
  return st;
}

/* ---------------- computer player ---------------- */
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function segClear(ax, ay, bx, by, r, coins, skip) {
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;

  else title = G.mode === 'ai' || G.mode === 'blitz' ? 'המחשב ניצח' : 'הפסדת';
  const why = G.mode === 'blitz' && G.blitz && G.blitz.reason === 'early'
    ? el('p', { class: 'bet lose', text: W === G.myTeam ? 'הפסד טכני למחשב — הוא הכניס את המלכה מוקדם מדי' : 'הפסד טכני — המלכה נכנסה לפני שלושת שלך' }) : null;
  const f = st.final || [teamPoints(st, 0), teamPoints(st, 1)];
  const scoreRow = el('div', { class: 'result' },
    el('span', null, String(f[0]), el('small', { text: G.teamNames[0] })),
    el('span', null, ':'),
    el('span', null, String(f[1]), el('small', { text: G.teamNames[1] })));
  const b = G.bet && G.bet.gid === st.gid && G.bet.paid ? G.bet : null;
  const betLine = b ? el('p', { class: 'bet ' + (b.won ? 'win' : 'lose'), text: b.won ? `+${fmtN(b.share)} מטבעות! (הרווחת ${fmtN(b.share - b.stake)})` : `הפסדת ${fmtN(b.stake)} מטבעות` }) : null;
  const arena = G.settings && G.settings.arena;
  const again = () => {
    if (G.mode === 'online') {
      if (!NET.isHost) return;
      G.st = newState(NET.fmt); placeBet(ONLINE_TABLE); NET.pres({ game: G.st, shot: null }); closeSheet(); beginTurn();
    } else if (G.settings && G.settings.mode === 'blitz') startBlitz(G.settings.level);
    else if (G.settings) startLocalGame(G.settings.mode, G.settings.fmt, G.settings.level, arena);
  };
  let againBtn;
  if (G.mode === 'online' && !NET.isHost) againBtn = el('p', { class: 'note', text: 'המארח יכול להתחיל משחק חוזר.' });
  else {
    againBtn = btn(arena ? `שוב ב${arena.name} · ${fmtN(arena.fee)}` : 'משחק חוזר', '', again, 'primary');
    if (arena && W$.data.coins < arena.fee) againBtn.disabled = true;
  }
  const blitzPay = G.mode === 'blitz' && G.blitz && G.blitz.prize
    ? el('p', { class: 'bet win', text: `+${G.blitz.prize} מטבעות!` }) : null;
  const info = [el('div', { class: 'big', text: title }), scoreRow, why, betLine, blitzPay, blitzPay ? walletPill() : null, b ? walletPill() : null, againBtn, btn(b && b.won && b.box ? 'ללובי — לפתוח את התיבה' : 'ללובי', '', backToLobby, 'quiet')];
  if (b && b.won && b.box) {
    // won a box: result on one side, the box to open on the other
    openSheet('over', el('div', { class: 'col' }, info.filter(Boolean)),
      el('div', { class: 'col center' }, chestCanvas(b.box, 170), el('div', { class: 'boxname', text: `זכית ב${BOXES[b.box].name}!` }), el('p', { class: 'note', text: 'פותחים אותה בלובי' })));
    $('panel').classList.add('split');
  } else openSheet('over', ...info);
}
$('menuBtn').addEventListener('click', () => {
  ensureAudio();
  if (sheetView === 'welcome' || sheetView === 'boot') return;
  if (sheetOpen && G.mode && G.st.winner === null) closeSheet(); else showHome();
});
$('sheet').addEventListener('pointerdown', ensureAudio);

/* ---------------- boot ---------------- */
new ResizeObserver(() => resize()).observe($('app'));
resize();
updateHud();
openSheet('boot', el('h1', { text: 'קארום' }), el('p', { class: 'note', text: 'טוען…' }));
bootAccount();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>

</body>
